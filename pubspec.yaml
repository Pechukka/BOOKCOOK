name: book_cook
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.2.2
  firebase_core: ^2.24.2
  firebase_auth: ^4.16.0
  cloud_firestore: ^4.14.0
  mobile_scanner: ^5.1.1   # cámara y lector de código de barras
  http: ^1.2.1              # llamadas a la API
  image_picker: ^1.0.7


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1  # ← añade esta línea

# Añade esto AL FINAL del pubspec.yaml
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo_brown.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true

  assets:
    - assets/images/logo_brown.png
    - assets/images/logo_white.png
    - assets/images/placeholder_recipe.png
    - assets/images/placeholder_ingredient.png